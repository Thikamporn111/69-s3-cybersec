worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;

  # JSON access log. scripts/watch-attacks.ps1 reads this to report who
  # connected, when, and how. escape=json keeps a hostile User-Agent or URI
  # -- the exact thing an attacker sends -- from breaking a log line, so the
  # payload is captured intact instead of corrupting the record.
  log_format json_combined escape=json
    '{'
      '"time":"$time_iso8601",'
      '"ip":"$remote_addr",'
      '"xff":"$http_x_forwarded_for",'
      '"method":"$request_method",'
      '"uri":"$log_uri",'
      '"status":$status,'
      '"bytes":$body_bytes_sent,'
      '"referer":"$http_referer",'
      '"ua":"$http_user_agent",'
      '"reqtime":$request_time'
    '}';
  access_log /dev/stdout json_combined;
  error_log /dev/stderr warn;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Credential endpoints: 10 requests per minute with a burst of 10, so a
  # password-guessing run gets roughly 600 tries an hour instead of the 1,800
  # the old 30r/m + burst 30 allowed. One full run of run-user-reset-test.ps1
  # spends 5 of them, which leaves room for two runs a minute.
  limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  map $http_user_agent $blocked_scanner {
    default 0;
    ~*(sqlmap|nikto|masscan|zgrab|acunetix|nessus|wpscan|gobuster|dirbuster|ffuf|feroxbuster) 1;
  }

  # Reset-token URLs carry the one-time `code` in the query string. Logging it
  # would leak a usable credential into the access log, so reset-password
  # entries record the path only. Every other URI keeps its query string.
  map $request_uri $log_uri {
    default $request_uri;
    ~*reset-password $uri;
  }

  # Public lab aliases. GET requests to Strapi Admin UI paths remain unchanged,
  # while matching REST methods are forwarded to Strapi's native API routes.
  map "$request_method:$uri" $strapi_request_uri {
    default $uri;
    "POST:/admin/auth/register-admin" /admin/register-admin;
    "POST:/admin/auth/login" /admin/login;
    "POST:/admin/auth/forgot-password" /admin/forgot-password;
    "POST:/admin/auth/reset-password" /admin/reset-password;
    "GET:/admin/auth/users/me" /admin/users/me;
    "POST:/api/auth/register" /api/auth/local/register;
    "POST:/api/auth/login" /api/auth/local;
    "GET:/api/auth/users/me" /api/users/me;
  }

  upstream strapi_backend {
    server strapi:1337;
    keepalive 16;
  }

  server {
    listen 8080 default_server;
    server_name _;

    # Plain HTTP on purpose. The published port binds to 127.0.0.1 only, so
    # there is no network path for anyone to intercept it. TLS is required
    # before this stack is reachable from anywhere else -- see SECURITY.md.

    client_max_body_size 5m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 30s;
    limit_conn connections_per_ip 20;

    # `if` with a bare `return` is one of the two usages nginx documents as safe.
    if ($blocked_scanner) {
      return 403;
    }

    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
      return 405;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location ~ /\. {
      deny all;
    }

    # Every route that accepts or consumes a credential, a reset token, or an
    # email trigger. The trailing `/?$` keeps a slash-suffixed request inside
    # this zone, because Strapi's router matches `/api/auth/local/` as well.
    location ~ ^/(admin/login|admin/register-admin|admin/forgot-password|admin/reset-password|admin/auth/login|admin/auth/register-admin|admin/auth/forgot-password|admin/auth/reset-password|api/auth/local|api/auth/local/register|api/auth/register|api/auth/login|api/auth/forgot-password|api/auth/reset-password|api/auth/change-password|api/auth/refresh|api/auth/email-confirmation|api/auth/send-email-confirmation)/?$ {
      limit_req zone=auth_per_ip burst=10 nodelay;
      proxy_pass http://strapi_backend$strapi_request_uri$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # $remote_addr, not $proxy_add_x_forwarded_for: appending would keep any
      # X-Forwarded-For the client sent, and this proxy is the only hop.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_hide_header X-Powered-By;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Strict-Transport-Security;
      proxy_hide_header Referrer-Policy;
      proxy_cookie_flags ~.* httponly samesite=lax;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    # Uploaded files. `Content-Security-Policy: sandbox` puts the response in an
    # opaque origin, so an uploaded HTML or SVG file cannot run script against
    # the admin panel's origin or read its storage. Images and media still
    # render. add_header in a location replaces the server-level set, so every
    # header above is repeated here on purpose.
    location ^~ /uploads/ {
      limit_except GET HEAD {
        deny all;
      }
      limit_req zone=api_per_ip burst=40 nodelay;

      add_header Content-Security-Policy "sandbox" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;

      proxy_pass http://strapi_backend$strapi_request_uri$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_hide_header X-Powered-By;
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Strict-Transport-Security;
      proxy_hide_header Referrer-Policy;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    location / {
      limit_req zone=api_per_ip burst=40 nodelay;
      proxy_pass http://strapi_backend$strapi_request_uri$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_hide_header X-Powered-By;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Strict-Transport-Security;
      proxy_hide_header Referrer-Policy;
      proxy_cookie_flags ~.* httponly samesite=lax;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }
  }
}
