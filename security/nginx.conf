worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  access_log /dev/stdout combined;
  error_log /dev/stderr warn;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  map $http_user_agent $blocked_scanner {
    default 0;
    ~*(sqlmap|nikto|masscan|zgrab|acunetix|nessus|wpscan|gobuster|dirbuster|ffuf|feroxbuster) 1;
  }

  # Public lab aliases. GET requests to Strapi Admin UI paths remain unchanged,
  # while matching REST methods are forwarded to Strapi's native API routes.
  map "$request_method:$uri" $strapi_request_uri {
    default $uri;
    "POST:/admin/auth/register-admin" /admin/register-admin;
    "POST:/admin/auth/login" /admin/login;
    "POST:/admin/auth/forgot-password" /admin/forgot-password;
    "POST:/admin/auth/reset-password" /admin/reset-password;
    "GET:/admin/auth/users/me" /admin/users/me;
    "POST:/api/auth/register" /api/auth/local/register;
    "POST:/api/auth/login" /api/auth/local;
    "GET:/api/auth/users/me" /api/users/me;
  }

  upstream strapi_backend {
    server strapi:1337;
    keepalive 16;
  }

  server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # A plain HTTP request that lands on this TLS port gets bounced back to
    # https on whatever port the client actually used, so the published port
    # stays a single value in .env.
    error_page 497 https://$http_host$request_uri;

    # No Strict-Transport-Security here on purpose. HSTS is scoped to the host
    # name and ignores the port, so sending it for "localhost" would force
    # HTTPS on every other localhost service on this machine. Turn it on when
    # this stack gets a real hostname and a trusted certificate.

    client_max_body_size 5m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 30s;
    limit_conn connections_per_ip 20;

    # `if` with a bare `return` is one of the two usages nginx documents as safe.
    if ($blocked_scanner) {
      return 403;
    }

    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
      return 405;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location ~ /\. {
      deny all;
    }

    # Every route that accepts or consumes a credential, a reset token, or an
    # email trigger. The trailing `/?$` keeps a slash-suffixed request inside
    # this zone, because Strapi's router matches `/api/auth/local/` as well.
    location ~ ^/(admin/login|admin/register-admin|admin/forgot-password|admin/reset-password|admin/auth/login|admin/auth/register-admin|admin/auth/forgot-password|admin/auth/reset-password|api/auth/local|api/auth/local/register|api/auth/register|api/auth/login|api/auth/forgot-password|api/auth/reset-password|api/auth/change-password|api/auth/email-confirmation|api/auth/send-email-confirmation)/?$ {
      limit_req zone=auth_per_ip burst=10 nodelay;
      proxy_pass http://strapi_backend$strapi_request_uri$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_hide_header X-Powered-By;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Strict-Transport-Security;
      proxy_hide_header Referrer-Policy;
      proxy_cookie_flags ~.* httponly samesite=lax secure;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    # Uploaded files are attacker-influenced content served from the same origin
    # as the admin panel. `sandbox` stops an uploaded HTML or SVG file from
    # running script in that origin when it is opened directly, while embedded
    # <img> use from the admin panel is unaffected. add_header in a location
    # replaces the whole inherited set, so the server headers are repeated here.
    location ^~ /uploads/ {
      limit_req zone=api_per_ip burst=40 nodelay;

      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self'; media-src 'self'" always;

      proxy_pass http://strapi_backend$strapi_request_uri$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_hide_header X-Powered-By;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Strict-Transport-Security;
      proxy_hide_header Referrer-Policy;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    location / {
      limit_req zone=api_per_ip burst=40 nodelay;
      proxy_pass http://strapi_backend$strapi_request_uri$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_hide_header X-Powered-By;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Strict-Transport-Security;
      proxy_hide_header Referrer-Policy;
      proxy_cookie_flags ~.* httponly samesite=lax secure;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }
  }
}
