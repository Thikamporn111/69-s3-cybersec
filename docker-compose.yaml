services:
  db:
    image: postgres:16-alpine
    container_name: 69-s3-db
    ports:
      - "54327:5432"
    environment:
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_DB=${DATABASE_DB}
    volumes:
      - "${POSTGRES_DATA_PATH:-./data/postgres}:/var/lib/postgresql/data"

  pgadmin:
    image: dpage/pgadmin4:9.16
    container_name: 69-s3-admin
    ports:
      - "8083:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - "${PGADMIN_DATA_PATH:-./data/pgadmin}:/var/lib/pgadmin"

  strapi:
    build:
      context: ./strapi
    container_name: 69-s3-strapi
    depends_on:
      - db
      - mailpit
    ports:
      - "${APP_PORT}:1337"
    volumes:
      - ./strapi/public/uploads:/opt/app/public/uploads
    environment:
      - DATABASE_CLIENT=postgres
      - DATABASE_NAME=${DATABASE_DB}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - APP_KEYS=${STRAPI_APP_KEYS}
      - API_TOKEN_SALT=${STRAPI_API_TOKEN_SALT}
      - ADMIN_JWT_SECRET=${STRAPI_ADMIN_JWT_SECRET}
      - TRANSFER_TOKEN_SALT=${STRAPI_TRANSFER_TOKEN_SALT}
      - JWT_SECRET=${STRAPI_JWT_SECRET}
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM=no-reply@cybersec.local

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: 69-s3-mailpit
    ports:
      - "8025:8025"
    expose:
      - "1025"
    environment:
      - MP_DATABASE=/data/mailpit.db
    volumes:
      - "${MAILPIT_DATA_PATH:-./data/mailpit}:/data"
